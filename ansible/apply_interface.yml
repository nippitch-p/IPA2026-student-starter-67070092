---
- name: Apply Desired Loopback Configuration
  hosts: routers
  gather_facts: false
  tasks:
    - name: Configure Loopback interface via cisco.ios.ios_config
      cisco.ios.ios_config:
        lines:
          - description {{ description }}
          - ip address {{ ipv4_address }} {{ netmask }}
          - "{{ 'shutdown' if (shutdown | bool) else 'no shutdown' }}"
        parents: "interface {{ interface_name }}"
        defaults: true
